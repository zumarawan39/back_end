<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Users List</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      #userList {
        max-width: 600px;
        margin: 30px auto;
        padding: 0;
        list-style: none;
      }

      li {
        background: #fff;
        padding: 15px 20px;
        margin-bottom: 10px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .info {
        display: flex;
        flex-direction: column;
      }

      .username {
        font-weight: bold;
        color: #007bff;
      }

      .password {
        font-size: 13px;
        color: #666;
      }

      .actions span {
        cursor: pointer;
        margin-left: 10px;
        font-size: 18px;
      }

      .edit {
        color: #28a745;
      }

      .delete {
        color: #dc3545;
      }
    </style>
  </head>

  <body>
    <h1>Users List</h1>
    <ul id="userList"></ul>

    <script>
      const API_URL = "http://localhost:8080";

      function editUser(index) {
        window.location.href = `edit.html?id=${index + 1}`;
      }
      function deleteUser(index) {
        fetch(`${API_URL}/register/${index}`, {
          method: "DELETE",
        }).then(() => {
          alert("User Deleted ✅");
          loadUsers();
        });
      }
      function loadUsers() {
        fetch(`${API_URL}/api/users`)
          .then((res) => res.json())
          .then((data) => {
            const ul = document.getElementById("userList");
            ul.innerHTML = "";

            data.forEach((user, index) => {
              const li = document.createElement("li");

              li.innerHTML = `
              <div class="info">
                <span class="username">Name:${user.username}</span>
                <span class="password">Password: ${user.password}</span>
              </div>

              <div class="actions">
                <span class="edit" onclick="editUser(${index})">✏️</span>
                <span class="delete" onclick="deleteUser(${index})">🗑️</span>
              </div>
            `;

              ul.appendChild(li);
            });
          });
      }
      loadUsers();
    </script>
  </body>
</html>
